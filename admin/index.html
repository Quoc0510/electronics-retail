<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Biểu tượng tab trình duyệt (logo TechStore): .ico cho trình duyệt cũ, PNG trong suốt cho trình duyệt mới, ảnh kín nền cho iOS -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>TechStore Admin - Quản trị cửa hàng</title>
    <script>
      // [F12] Đặt chế độ sáng/tối trước khi vẽ trang để không bị chớp nền trắng (khóa lưu khớp shared/src/theme.js)
      (function () {
        try {
          var theme = localStorage.getItem('techstore.theme');
          if (theme !== 'dark' && theme !== 'light') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
