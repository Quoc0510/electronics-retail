# @feature [F00] Nền tảng - CI/CD: lint -> test + coverage -> quét bí mật -> kiểm tra thư viện -> build -> đóng gói và chạy thử Docker -> E2E.
# Bảy chặng (rubric TC2.6, KPI-05). Chặng triển khai tự động lên staging sẽ thêm khi chọn xong nơi đặt staging.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint và kiểm tra format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test và coverage (backend, client, admin)
    runs-on: ubuntu-latest
    # Test tích hợp backend chạy trên PostgreSQL thật (schema "test"), nên pipeline cần một service database
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: electronics
          POSTGRES_PASSWORD: electronics_dev
          POSTGRES_DB: electronics_retail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U electronics -d electronics_retail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://electronics:electronics_dev@localhost:5432/electronics_retail?schema=test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Prisma Client cần được sinh ra trước khi chạy test backend
      - run: npx prisma generate --schema backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      # Chạy test kèm đo độ phủ (KPI-03): một lần chạy cho cả hai việc
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            shared/coverage
            backend/coverage
            client/coverage
            admin/coverage
          if-no-files-found: ignore

  secrets:
    name: Quét bí mật bị lộ (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # quét cả lịch sử commit, không chỉ bản mới nhất
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Kiểm tra lỗ hổng thư viện (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chặn merge nếu có lỗ hổng mức Critical trong thư viện chạy thật
      - run: npm audit --omit=dev --audit-level=critical
      # Mức High chỉ báo cáo (không chặn): hiện còn 3 cảnh báo do công cụ Prisma CLI 6, sẽ hết khi nâng lên Prisma 7 (docs/TECH_DEBT.md)
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  build:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    name: Đóng gói Docker và chạy thử
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      # Chỉ dùng trong pipeline để chạy thử, không phải bí mật thật
      POSTGRES_PASSWORD: ci-only-password
      JWT_ACCESS_SECRET: ci-only-secret-khong-dung-o-dau-khac-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      # Dựng cả backend, client, admin rồi chờ container báo khỏe (health check trong Dockerfile)
      - run: docker compose -f docker-compose.staging.yml up -d --build --wait --wait-timeout 180
      # Gọi qua nginx của Client như trình duyệt: kiểm tra proxy /api và kết nối database (migration đã áp)
      - name: Chạy thử hệ thống
        run: |
          # Ghi ra file rồi mới grep: `curl | grep -q` có thể bị SIGPIPE làm pipeline lỗi giả khi bật pipefail
          curl --fail --silent --show-error http://localhost:8080/ -o client.html
          grep -q '<div id="root">' client.html
          curl --fail --silent --show-error http://localhost:8080/api/health/ready
          curl --fail --silent --show-error http://localhost:8081/ -o admin.html
          grep -q '<div id="root">' admin.html
          curl --fail --silent --show-error "http://localhost:8080/api/products?pageSize=1"
      - name: Log khi lỗi
        if: failure()
        run: docker compose -f docker-compose.staging.yml logs --no-color --tail=100
      - name: Dọn dẹp
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  e2e:
    name: Kiểm thử E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Dựng cả hệ thống bằng Docker ở cổng riêng (18080, 18081) và nạp dữ liệu mẫu, rồi chạy các kịch bản trên trình duyệt thật
      - run: npm run e2e:up
      - run: npm run e2e
      - name: Báo cáo và log khi lỗi
        if: failure()
        run: docker compose -p techstore-e2e -f docker-compose.staging.yml logs --no-color --tail=150
        env:
          POSTGRES_PASSWORD: e2e-only-password
          JWT_ACCESS_SECRET: e2e-only-secret-khong-dung-o-dau-khac-0123456789abcdef
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Dọn dẹp
        if: always()
        run: npm run e2e:down
